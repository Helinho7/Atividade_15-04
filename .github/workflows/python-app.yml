# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Testando o Código
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar o pytest no projeto
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short


  Imagem:
    name: Construindo imagem para o Docker
    runs-on: ubuntu-latest
    needs: build

    steps:

      - uses: actions/checkout@v4
    
      - name: Docker Login
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Configurar o Docker na VM
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            helinho7/senai_api_ta:latest
            helinho7/senai_api_ta:${{ github.sha }}


  DEPLOY_HML:
    name: Deploy Homologacao
    runs-on: ubuntu-latest
    needs: Imagem

    if: github.ref == 'refs/heads/develop'

    environment:
      name: homologacao

    steps:
      - name: Deploy na EC2 HML
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_HML }}
          username: ${{ secrets.EC2_USER_HML }}
          key: ${{ secrets.EC2_KEY_HML }}

          script: |
            echo "Deploy HML"

            sudo docker pull helinho7/senai_api_ta:latest

            sudo docker stop senai_api_ta_hml 2>/dev/null || true
            sudo docker rm senai_api_ta_hml 2>/dev/null || true

            sudo docker run --name senai_api_ta_hml -d -p 8080:8080 helinho7/senai_api_ta:latest

            sleep 5

            curl -f http://localhost:8080/health || exit 1

            echo "Deploy HML feito com sucesso"


  DEPLOY_PRODUCAO:
    name: Deploy Producao
    runs-on: ubuntu-latest
    needs: Imagem

    if: github.ref == 'refs/heads/main'

    environment:
      name: producao

    steps:
      - name: Deploy na EC2 PROD
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}

          script: |
            echo "Deploy PROD"

            sudo docker pull helinho7/senai_api_ta:latest

            sudo docker stop senai_api_ta 2>/dev/null || true
            sudo docker rm senai_api_ta 2>/dev/null || true

            sudo docker run --name senai_api_ta -d -p 80:8080 helinho7/senai_api_ta:latest

            sleep 5

            curl -f http://localhost/health || exit 1

            echo "Deploy PROD feito com sucesso"
           
       
      
              
      
      
